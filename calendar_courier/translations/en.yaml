configuration:
  imap_host:
    name: IMAP server
    description: Mail server of the mailbox that receives the invitations, e.g. imap.example.com
  imap_port:
    name: IMAP port
    description: Usually 993 (SSL/TLS)
  imap_user:
    name: IMAP username
    description: Usually the email address of the mailbox
  imap_password:
    name: IMAP password
  imap_folder:
    name: Folder
    description: Folder where the invitations arrive
  processed_folder:
    name: Archive folder (optional)
    description: Processed invitations are moved here. The folder must exist.
  caldav_url:
    name: CalDAV calendar URL
    description: e.g. https://cloud.example.com/remote.php/dav/calendars/family/family/
  caldav_user:
    name: CalDAV username
  caldav_password:
    name: CalDAV password
    description: Preferably a Nextcloud app password
  allowed_senders:
    name: Allowed senders
    description: Only invitations from these addresses are accepted
  delete_processed:
    name: Delete processed invitations
    description: Valid invitations from allowed senders are deleted from the mailbox after they have been added to the calendar. Other mails are kept.
  poll_interval:
    name: Polling interval (seconds)
  log_level:
    name: Log level
