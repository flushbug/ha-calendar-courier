name: Calendar Courier
version: "1.3.0"
slug: calendar_courier
description: Delivers meeting invitations from a mailbox into a shared CalDAV calendar (e.g. Nextcloud) – including reschedules and cancellations.
url: https://github.com/Flushbug/ha-calendar-courier
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
options:
  imap_host: ""
  imap_port: 993
  imap_user: ""
  imap_password: ""
  imap_folder: INBOX
  caldav_url: ""
  caldav_user: ""
  caldav_password: ""
  allowed_senders: []
  delete_processed: false
  poll_interval: 120
  log_level: info
schema:
  imap_host: str
  imap_port: port
  imap_user: str
  imap_password: password
  imap_folder: str
  processed_folder: str?
  caldav_url: url
  caldav_user: str
  caldav_password: password
  allowed_senders:
    - email
  delete_processed: bool
  poll_interval: int(30,3600)
  log_level: list(debug|info|warning|error)
